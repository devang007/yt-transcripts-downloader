<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="yt-tx — turn an entire YouTube channel into a book">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="50%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <clipPath id="type"><rect x="60" y="150" width="0" height="40">
      <animate attributeName="width" values="0;0;520;520;0" keyTimes="0;0.05;0.55;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect></clipPath>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", "DejaVu Sans Mono", monospace; }
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, "DejaVu Sans", sans-serif; }
      .dot  { animation: flow 3.2s linear infinite; }
      .d2 { animation-delay: -1.07s } .d3 { animation-delay: -2.13s }
      @keyframes flow { 0% { transform: translateX(0); opacity: 0 }
                        8% { opacity: 1 } 92% { opacity: 1 }
                        100% { transform: translateX(672px); opacity: 0 } }
      .blink { animation: b 1s steps(1) infinite }
      @keyframes b { 50% { opacity: 0 } }
      .pulse { animation: p 2.6s ease-in-out infinite }
      @keyframes p { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    </style>
  </defs>

  <rect width="1000" height="300" rx="16" fill="#0b0f14"/>
  <rect width="1000" height="300" rx="16" fill="url(#edge)" opacity=".55"/>
  <rect x="1" y="1" width="998" height="298" rx="15" fill="none" stroke="#1f2937" stroke-width="2"/>

  <text x="60" y="98" class="sans" font-size="62" font-weight="700" fill="url(#sheen)">yt-tx</text>
  <text x="215" y="98" class="mono" font-size="19" fill="#64748b">v1.0 · MIT · python 3.11+ · mysql 8</text>
  <text x="60" y="132" class="sans" font-size="23" fill="#cbd5e1">turn an entire YouTube channel into a book worth reading</text>

  <rect x="46" y="146" width="700" height="46" rx="8" fill="#0f172a" stroke="#1f2937"/>
  <g clip-path="url(#type)">
    <text x="60" y="177" class="mono" font-size="19" fill="#34d399">$ yt-tx channels add @lexfridman &amp;&amp; yt-tx run</text>
  </g>
  <rect x="60" y="158" width="9" height="24" fill="#38bdf8" class="blink">
    <animate attributeName="x" values="60;60;580;580;60" keyTimes="0;0.05;0.55;0.9;1" dur="9s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(60,232)">
    <line x1="14" y1="18" x2="686" y2="18" stroke="#1f2937" stroke-width="2"/>
    <g class="dot"><circle cx="14" cy="18" r="4" fill="#38bdf8"/></g>
    <g class="dot d2"><circle cx="14" cy="18" r="4" fill="#a78bfa"/></g>
    <g class="dot d3"><circle cx="14" cy="18" r="4" fill="#34d399"/></g>
    <g fill="#0b0f14" stroke="#334155">
      <circle cx="14"  cy="18" r="9"/><circle cx="238" cy="18" r="9"/>
      <circle cx="462" cy="18" r="9"/><circle cx="686" cy="18" r="9"/>
    </g>
    <g class="mono" font-size="15" fill="#94a3b8" text-anchor="middle">
      <text x="14" y="48">channel</text><text x="238" y="48">transcripts</text>
      <text x="462" y="48">evidence cards</text><text x="686" y="48">book</text>
    </g>
  </g>

  <g transform="translate(800,150)" class="mono" font-size="15">
    <rect x="-20" y="-42" width="180" height="140" rx="10" fill="#0f172a" stroke="#1f2937"/>
    <circle cx="-4" cy="-22" r="4" fill="#34d399" class="pulse"/>
    <text x="10" y="-17" fill="#94a3b8">resumable runs</text>
    <circle cx="-4" cy="6" r="4" fill="#38bdf8" class="pulse" style="animation-delay:-.9s"/>
    <text x="10" y="11" fill="#94a3b8">SKIP LOCKED</text>
    <circle cx="-4" cy="34" r="4" fill="#a78bfa" class="pulse" style="animation-delay:-1.8s"/>
    <text x="10" y="39" fill="#94a3b8">circuit breaker</text>
    <circle cx="-4" cy="62" r="4" fill="#facc15" class="pulse" style="animation-delay:-2.4s"/>
    <text x="10" y="67" fill="#94a3b8">cited chapters</text>
  </g>
</svg>
