# Disposable MySQL 8 for tests and local runs.
#
#   docker compose up -d db
#   export YT_TX_TEST_DSN='mysql+pymysql://root:devpassword@127.0.0.1:3307/yt_tx_test?charset=utf8mb4'
#   pytest -m mysql
#
# Port 3307 on the host so this never fights a system MySQL on 3306.
#
# Do not run the test suite against SQLite instead. SELECT ... FOR UPDATE SKIP
# LOCKED, INSERT ... ON DUPLICATE KEY UPDATE with row aliases, ENUM coercion and
# FULLTEXT have no SQLite equivalent, and those are exactly the mechanisms this
# project's correctness rests on.

services:
  db:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # STRICT_TRANS_TABLES so an over-long title errors instead of being
      # silently truncated halfway through a big channel.
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION,ERROR_FOR_DIVISION_BY_ZERO
      - --default-time-zone=+00:00
      # A 3h livestream's flattened plaintext runs to several MB.
      - --max-allowed-packet=64M
      # Default is 3, which makes two-letter words unsearchable in FULLTEXT.
      - --innodb-ft-min-token-size=2
      - --innodb-flush-log-at-trx-commit=2
    environment:
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_DATABASE: yt_tx
      MYSQL_USER: yt_tx
      MYSQL_PASSWORD: devpassword
    ports:
      - "3307:3306"
    volumes:
      - yt_tx_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdevpassword"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  yt_tx_mysql:
